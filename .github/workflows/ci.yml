name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  GOPRIVATE: github.com/Merge42-SyncBase/*

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      # syncbase-was and syncbase-embedding are private modules; GH_MODULES_TOKEN
      # is a fine-grained PAT (Contents: read) with access to both.
      - name: Configure private module access
        run: git config --global url."https://x-access-token:${{ secrets.GH_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - run: go build ./cmd/...
      - run: go vet ./...
      - run: go test ./...

  docker:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          secrets: |
            github_token=${{ secrets.GH_MODULES_TOKEN }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/merge42-syncbase/syncbase-mcp:latest
            ghcr.io/merge42-syncbase/syncbase-mcp:sha-${{ steps.vars.outputs.sha_short }}
